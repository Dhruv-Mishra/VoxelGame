<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Port Solace</title>
<style>
  :root{--bg:rgba(14,16,20,.55);--bg2:rgba(14,16,20,.94);--line:rgba(255,255,255,.12);--ink:#eef1f2;--dim:#a9b1b6;--accent:#8bd8c3;--r:12px;--font:system-ui,-apple-system,'Segoe UI',sans-serif}
  html,body{margin:0;height:100%;overflow:hidden;background:#101216;font-family:var(--font);color:var(--ink);letter-spacing:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5}
  #ui .pe{pointer-events:auto}
  #loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#22272a,#101216 75%);transition:opacity .18s ease;padding:20px}
  #loader h1{font-size:32px;margin:0 0 10px;font-weight:500;text-align:center}
  #loader .sub{font-size:12px;color:var(--dim);margin-bottom:32px;text-align:center}
  #loader .bar{width:min(280px,70vw);height:2px;overflow:hidden;background:var(--line)}
  #loader .fill{height:100%;width:0;background:var(--accent);transition:width .18s}
  #loader .msg{margin-top:14px;font-size:11px;color:var(--dim);min-height:18px}
  #loader.done{opacity:0;pointer-events:none}
</style></head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<div id="ui"></div>
<div id="loader"><h1>PORT SOLACE</h1><div class="sub">a harbour city where the lights never quite go out</div><div class="bar"><div class="fill" id="ldfill"></div></div><div class="msg" id="ldmsg">loading…</div></div>
